<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Report Explorer</title>
  <link rel="stylesheet" href="web/css/style.css">
</head>
<body>
  <header>
    <h1>Report Explorer <span class="subtitle">Who, what, when and where</span></h1>

    <div class="controls">
      <!-- Search: a datalist suggests names as you type (recognition, not recall). -->
      <label class="control">
        Find person
        <input id="search" type="search" list="person-names"
               placeholder="Type a name or alias" autocomplete="off">
        <datalist id="person-names"></datalist>
      </label>

      <button id="undo" type="button" disabled title="Nothing to undo yet">&#8630; Undo</button>
      <button id="reset" type="button" title="Clear the selection and show the whole network (Esc)">Reset view</button>
    </div>
  </header>

  <main>
    <div id="views">
      <section id="network-area" aria-label="People network">
        <svg id="network"></svg>
        <div id="legend">
          <span><svg width="16" height="16" viewBox="-8 -8 16 16" class="legend-person"><circle cy="-3.4" r="3"/><path d="M-6.6,7.2 Q-6.6,0.2 0,0.2 Q6.6,0.2 6.6,7.2 Z"/></svg> Person (size = number of reports)</span>
          <span><svg width="16" height="16" viewBox="-8 -8 16 16" class="legend-report"><path d="M-5,-6.5 H2 L5,-3.5 V6.5 H-5 Z"/></svg> Report</span>
          <span><svg width="26" height="10"><line x1="0" y1="5" x2="26" y2="5" class="legend-link"/></svg> Person is named in the report</span>
          <span><svg width="26" height="10"><line x1="0" y1="5" x2="26" y2="5" class="legend-possible"/></svg> Possibly the same person</span>
        </div>
        <p id="status" role="status"></p>
        <p id="search-message" role="alert"></p>
      </section>

    </div>

    <aside id="panel" aria-live="polite"></aside>
  </main>

  <!-- D3 v7 (ISC license, https://d3js.org), bundled so the page works offline. -->
  <script src="web/lib/d3.min.js"></script>
  <!-- Data generated by the scripts in processing/ (written to web/data/). -->
  <script src="web/data/network.js"></script>
  <script src="web/data/ai_summaries.js"></script>
  <!-- Application code: shared state first, then the parts of the page, then main. -->
  <script src="web/js/app.js"></script>
  <script src="web/js/tooltip.js"></script>
  <script src="web/js/network.js"></script>
  <script src="web/js/summaries.js"></script>
  <script src="web/js/new_tab.js"></script>
  <script src="web/js/panel.js"></script>
  <script src="web/js/main.js"></script>
</body>
</html>
